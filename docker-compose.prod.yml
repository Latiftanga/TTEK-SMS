# Production compose file — see DEPLOY.md before using this.
#
# Differences from docker-compose.yml (dev):
#   - no bind mounts anywhere (images are self-contained, built from source
#     at deploy time, not live-edited)
#   - db/redis are not exposed to the host at all — reachable only on the
#     internal compose network
#   - api runs uvicorn without --reload, with multiple workers, and does NOT
#     auto-create the superadmin account on every boot (see DEPLOY.md for
#     the one-time bootstrap step)
#   - frontend is a real adapter-node production build (Dockerfile.prod),
#     not the Vite dev server
#   - a proxy service (Caddy) is the only port published to the host — it
#     routes /api/* to the backend and everything else to the frontend.
#     In dev this routing is done by Vite's dev-server proxy (vite.config.ts),
#     which has no equivalent once the frontend is a built adapter-node app;
#     without this, the production build boots but every API call 404s.
#     Plain HTTP for now — no TLS/domain is configured here, that's still a
#     separate step for whenever a real domain is pointed at this VPS (see
#     DEPLOY.md); Caddy can pick up automatic HTTPS later with a one-line
#     Caddyfile change once that happens, not a code change.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ttek_sms}
      POSTGRES_USER: ${POSTGRES_USER:-ttek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ttek} -d ${POSTGRES_DB:-ttek_sms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
      - secure_uploads_data:/app/secure_uploads
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    command: >
      sh -c "
        alembic upgrade head &&
        python scripts/seed_reference_data.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      "

  # ── ARQ worker ──────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
      - secure_uploads_data:/app/secure_uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.worker

  # ── SvelteKit frontend (production build) ───────────────────────────────────
  # /api/* calls (axios baseURL: '/api' in lib/api/client.ts) reach the
  # backend via the proxy service below, not via this container directly —
  # no PUBLIC_API_URL here, that var only ever drove Vite's dev-only proxy.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      PORT: 3000
      # SvelteKit's adapter-node uses ORIGIN for absolute-URL construction
      # and its built-in CSRF Origin check. This app serves every school on
      # its own subdomain (<school_code>.<platform_domain>) rather than one
      # fixed origin, which adapter-node's single-ORIGIN model wasn't
      # designed around — verify form submissions work on the real domain
      # after first deploy (see DEPLOY.md); this may need ORIGIN unset in
      # favor of header-based origin detection instead, depending on what
      # the proxy forwards.
      ORIGIN: ${FRONTEND_BASE_URL:-http://localhost}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  # ── Reverse proxy (Caddy) ────────────────────────────────────────────────────
  # The only service that publishes a port to the host. Plain HTTP on :80 —
  # no TLS/domain configured yet, see the file header comment above.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  secure_uploads_data:
  caddy_data:
