<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @page { size: A4 landscape; margin: 15mm 12mm; }
  body { font-family: Arial, sans-serif; font-size: 9pt; color: #111; }
  .school-header { text-align: center; margin-bottom: 10px; }
  .school-header h1 { font-size: 14pt; margin: 0; }
  .school-header h2 { font-size: 11pt; margin: 2px 0 0; font-weight: normal; }
  .meta { text-align: right; font-size: 8pt; color: #555; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #1e40af; color: #fff; padding: 5px 6px; text-align: left; font-size: 8pt; }
  td { padding: 4px 6px; border-bottom: 1px solid #e5e7eb; font-size: 8pt; vertical-align: top; }
  tr:nth-child(even) td { background: #f0f4ff; }
  .footer { margin-top: 12px; font-size: 8pt; color: #555; display: flex; justify-content: space-between; }
</style>
</head>
<body>
  <div class="school-header">
    <h1>{{ school.name }}</h1>
    <h2>{{ title }}</h2>
  </div>
  <div class="meta">Generated: {{ generated_at }} &nbsp;|&nbsp; Total: {{ total }}</div>

  <table>
    <thead>
      <tr>
        {% for h in headers %}<th>{{ h }}</th>{% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        {% for cell in row %}<td>{{ cell }}</td>{% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <div class="footer">
    <span>{{ school.name }} — Confidential</span>
    <span>TTEK-SMS</span>
  </div>
</body>
</html>
